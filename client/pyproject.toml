[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gc-ai-client"
version = "0.2.0"
description = "Client for the GC-AI symbol detection and SBOL3 generation service"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
# Storing designs in an SBOL DB registry.
db = ["sbol-db>=0.1"]
# Serving the GC-AI service over MCP.
mcp = ["mcp>=2.3,<3"]
dev = [
    "pytest>=8.0",
    "mypy>=1.8",
    "black>=24.1",
    "isort>=5.13",
    "flake8>=7.0",
    "pyyaml>=6.0",
    # The integration tests compare generated documents as RDF graphs.
    "rdflib>=6.2",
]

[project.scripts]
gcai = "gcai.cli:main"
gcai-mcp = "gcai.mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gcai"]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
strict = true
python_version = "3.10"
# The examples live outside the package and import it, so mypy is told where
# it is. Relative to the repo root, which is where the hooks run.
mypy_path = "client/src"

[[tool.mypy.overrides]]
module = ["sbol_db.*", "rdflib.*", "mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running GC-AI stack (set GCAI_URL)"]
# --strict-markers turns an unregistered marker into an error, so running the
# tests without this configuration fails loudly instead of quietly skipping.
addopts = "-m 'not integration' --strict-markers"
