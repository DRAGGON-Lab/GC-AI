[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gc-ai-client"
version = "0.1.0"
description = "Client for the GC-AI symbol detection and SBOL3 generation service"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
# Reading and validating generated documents locally.
sbol = ["sbol3>=1.2", "rdflib>=6.2"]
# Publishing to an SBOL DB registry. The registry reads SBOL3 and converts to
# SBOL2 itself, so no local converter is needed.
db = ["sbol-db>=0.1"]
dev = ["pytest>=8.0", "mypy>=1.8", "black>=24.1", "isort>=5.13", "flake8>=7.0", "pyyaml>=6.0"]

[project.scripts]
gcai = "gcai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gcai"]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
strict = true
python_version = "3.10"

[[tool.mypy.overrides]]
module = ["sbol3.*", "sbol_db.*", "rdflib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running GC-AI stack (set GCAI_URL)"]
# --strict-markers turns an unregistered marker into an error, so running the
# tests without this configuration fails loudly instead of quietly skipping.
addopts = "-m 'not integration' --strict-markers"
