name: backend
on: [push, pull_request]

jobs:
  test:
    name: Backend isolated API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r backend/requirements-test.txt -e client
      - run: python -m pytest backend/tests -q

  cross-client:
    name: Cross-client HTTP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-test.txt -e 'client[mcp]' nbclient nbformat ipykernel ipython
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix frontend
      - name: Python, CLI, MCP, React conversion and notebook against actual HTTP
        run: python -m pytest tools/tests -q --disable-warnings
        env:
          PYTHONPATH: backend:client/src
