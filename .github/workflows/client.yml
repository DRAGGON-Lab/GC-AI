name: client

on:
  push:
    paths: ["client/**", ".github/workflows/client.yml", ".pre-commit-config.yaml"]
  pull_request:
    paths: ["client/**", ".github/workflows/client.yml", ".pre-commit-config.yaml"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run the tests
        # The integration tests need a running service and are not selected here.
        run: uv run --python ${{ matrix.python-version }} --project client pytest
