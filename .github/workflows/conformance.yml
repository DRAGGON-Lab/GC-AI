name: SBOL conformance
on:
  push:
    paths: ['backend/**', 'tools/**', 'docs/examples/**', 'docs/validation/**', '.github/workflows/conformance.yml']
  pull_request:
    paths: ['backend/**', 'tools/**', 'docs/examples/**', 'docs/validation/**', '.github/workflows/conformance.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.96.1
      - run: pip install -r backend/requirements-test.txt
      - run: cargo build --locked --manifest-path tools/sbol-diagnostics/Cargo.toml
      - name: Verify immutable historical evidence and regenerated SBOL
        run: >-
          python tools/reconcile_sbol_validation.py --mode verify
          --probe tools/sbol-diagnostics/target/debug/gcai-sbol-diagnostics
          --regenerate "${{ runner.temp }}/gcai-conformance"
          --output "${{ runner.temp }}/gcai-conformance-report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbol-conformance-evidence
          path: |
            ${{ runner.temp }}/gcai-conformance-report.json
            ${{ runner.temp }}/gcai-conformance/
