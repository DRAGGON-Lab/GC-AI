name: deployment-boundaries
on:
  push:
    paths: ['backend/**', 'frontend/**', '.github/workflows/deployment.yml']
  pull_request:
    paths: ['backend/**', 'frontend/**', '.github/workflows/deployment.yml']
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build reviewed application images
        run: |
          docker build -f backend/Dockerfile -t gcai-backend:check .
          docker build -f frontend/Dockerfile -t gcai-frontend:check .
      - name: Run detector-free real decoder regressions inside runtime image
        run: |
          docker run --rm -v "$PWD:/source:ro" gcai-backend:check python -m pytest /source/backend/tests/test_inference.py /source/backend/tests/test_artifacts.py /source/backend/tests/test_conversion_handles.py -q --disable-warnings
      - name: Check WSGI liveness without checkpoint and database
        run: |
          docker run -d --name gcai-check -e GCAI_BIND=0.0.0.0:5001 -p 127.0.0.1:5001:5001 gcai-backend:check
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5001/livez && break; sleep 1; done
          curl -fsS http://127.0.0.1:5001/livez
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5001/healthcheck/)" = 503
      - if: always()
        run: docker rm -f gcai-check || true
